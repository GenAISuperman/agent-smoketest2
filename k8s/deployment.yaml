apiVersion: apps/v1
kind: Deployment
metadata:
  name: "smoketest2"
  namespace: "agents-platform-eng"
  labels:
    app: "smoketest2"
    team: "platform-eng"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "smoketest2"
  template:
    metadata:
      labels:
        app: "smoketest2"
        team: "platform-eng"
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: "sa-smoketest2"
      containers:
        - name: "smoketest2"
          image: "acragenticdemopoc.azurecr.io/agents/smoketest2:latest"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: "config-smoketest2"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
